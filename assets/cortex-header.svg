<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>

    <!-- Orange Radiant Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff9100" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.18;0.32;0.18" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9100" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff9100" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#ff9100;#ffaa33;#ff7700;#ff9100" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0" />
    </linearGradient>

    <!-- Logo Glow Filter -->
    <filter id="cortexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 6px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 12px;
      fill: #ff9100;
      text-transform: uppercase;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
    .badge {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      fill: #e6edf3;
      font-weight: 600;
    }
    .orbit {
      animation: rotate 20s linear infinite;
      transform-origin: 600px 105px;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1f2024" stroke-width="1.5" />
  <rect width="1200" height="380" rx="16" fill="url(#glow)" />

  <!-- Animated Ambient Tech Grid Marks -->
  <g opacity="0.15">
    <circle cx="150" cy="80" r="1.5" fill="#ff9100" />
    <circle cx="250" cy="140" r="1.5" fill="#ff9100" />
    <circle cx="1050" cy="90" r="1.5" fill="#ff9100" />
    <circle cx="950" cy="150" r="1.5" fill="#ff9100" />
    <circle cx="180" cy="280" r="1.5" fill="#ff9100" />
    <circle cx="1020" cy="270" r="1.5" fill="#ff9100" />
    <path d="M 100,50 L 120,50 M 100,50 L 100,70" stroke="#ff9100" stroke-width="1" fill="none" />
    <path d="M 1100,50 L 1080,50 M 1100,50 L 1100,70" stroke="#ff9100" stroke-width="1" fill="none" />
    <path d="M 100,330 L 120,330 M 100,330 L 100,310" stroke="#ff9100" stroke-width="1" fill="none" />
    <path d="M 1100,330 L 1080,330 M 1100,330 L 1100,310" stroke="#ff9100" stroke-width="1" fill="none" />
  </g>

  <!-- Decorative Orbit Arc -->
  <circle cx="600" cy="105" r="54" fill="none" stroke="#ff9100" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" class="orbit" />

  <!-- Center Cortex Hexagonal C1 Emblem -->
  <g transform="translate(565, 70)" filter="url(#cortexGlow)">
    <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="#121316" stroke="#ff9100" stroke-width="2.5" />
    <path d="M 45,26 L 25,37 L 25,53 L 45,64" fill="none" stroke="#ff9100" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="38,34 38,56 45,56" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Branding -->
  <text x="600" y="195" text-anchor="middle" class="title">CORTEX</text>
  <text x="600" y="222" text-anchor="middle" class="subtitle">CODE BEYOND LIMITS</text>

  <!-- Glowing Accent Divider -->
  <line x1="320" y1="242" x2="880" y2="242" stroke="url(#lineGrad)" stroke-width="2" />

  <!-- Tagline -->
  <text x="600" y="274" text-anchor="middle" class="tagline">
    Universal Cloud IDE · 16 Language Sandboxes · Gemini 2.5 Flash Auto-Fix · Zero-Latency Execution
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 318)">
    <!-- Pill 1: 16 Runtimes -->
    <g transform="translate(-320, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#14151a" stroke="#2a2c35" stroke-width="1" />
      <circle cx="-52" cy="0" r="4" fill="#10b981" />
      <text x="8" y="4.5" text-anchor="middle" class="badge">16 Cloud Runtimes</text>
    </g>
    <!-- Pill 2: Gemini Auto-Fix -->
    <g transform="translate(-105, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#14151a" stroke="#2a2c35" stroke-width="1" />
      <circle cx="-62" cy="0" r="4" fill="#ff9100" />
      <text x="8" y="4.5" text-anchor="middle" class="badge">Gemini 2.5 Auto-Fix</text>
    </g>
    <!-- Pill 3: Monaco Editor -->
    <g transform="translate(105, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#14151a" stroke="#2a2c35" stroke-width="1" />
      <circle cx="-52" cy="0" r="4" fill="#38bdf8" />
      <text x="8" y="4.5" text-anchor="middle" class="badge">Monaco Editor</text>
    </g>
    <!-- Pill 4: 100% SSG -->
    <g transform="translate(305, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#14151a" stroke="#2a2c35" stroke-width="1" />
      <circle cx="-42" cy="0" r="4" fill="#a855f7" />
      <text x="10" y="4.5" text-anchor="middle" class="badge">100% SSG SEO</text>
    </g>
  </g>
</svg>
