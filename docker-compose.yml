version: '3.8'

services:
  cortex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FEEDBACK_RECIPIENT_EMAIL=${FEEDBACK_RECIPIENT_EMAIL:-support@cortexcode.io}
      - FEEDBACK_WEBHOOK_URL=${FEEDBACK_WEBHOOK_URL:-}
    volumes:
      # Persistent volume for feedback database
      - cortex-data:/app/data

volumes:
  cortex-data:
